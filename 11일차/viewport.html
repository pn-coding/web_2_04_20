<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .box{
            width: 50vw;
            height: 20vw;
            background-color: lightslategray;
        }

    </style>
</head>
<body>
    
    <!-- *viewport 
    =>디바이스 크기 가로 또는 세로 사이즈 

    *vw
    =>Viewport Width
    =>디바이스 가로 크기

    *vh
    =>Viewport Height
    =>디바이스 세로 크기 -->

    <div class="box"></div>

</body>
</html>
