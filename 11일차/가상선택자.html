<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        *{
            margin: 0;
            padding: 0;
        }

        .box{
            width: 300px;
            height: 500px;
            background-color: teal;
        }

        .box::before{
            content: "";
            width: 100%;
            height: 100px;
            background-color: salmon;
            display: block;
        }

        .box::after{
            content: "";
            width: 100%;
            height: 100px;
            background-color: gold;
            display: block;
        }

        /* *before, after 
        =>태그안에 자식태그 없이 css에서 자식 태그 만들수 있음 
        =>content안에 글자내용을 넣을수 있으며 없으면 내용 비워두면됨 */

    </style>

</head>
<body>
    
    <div class="box"></div>

</body>
</html>
