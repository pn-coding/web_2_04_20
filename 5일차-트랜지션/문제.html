<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .wrap{
            width: 500px;
            height: 500px;
            background-color: lightgray;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
        }

        .line{
            background-color: salmon;
            position: absolute;
            transition: 1s;
        }

        .top,
        .bottom{
            width: 0%;
            height: 10px;  
        }

        .right,
        .left{
            width: 10px;
            height: 0%;
        }

        .top{
            top: 0;
            left: 0;
        }

        .right{
            right: 0;
            top: 0;
        }

        .bottom{
            bottom: 0;
            right: 0;
        }

        .left{
            bottom: 0;
            left: 0;
        }

        .title{
            opacity: 0; 
        }

        .wrap:hover .top{
            width: 100%;
        }

        .wrap:hover .right{
            height: 100%;
            transition-delay: 1s;
        }

        .wrap:hover .bottom{
            width: 100%;
            transition-delay: 2s;
        }

        .wrap:hover .left{
            height: 100%;
            transition-delay: 3s;
        }

        .wrap:hover .title{
            opacity: 1;
            transition: 1s;
            transition-delay: 4s;
        }

    </style>

</head>
<body>
    
    <div class="wrap">

        <div class="line top"></div>
        <div class="line right"></div>
        <div class="line bottom"></div>
        <div class="line left"></div>
        <h2 class="title">Title</h2>

    </div>

</body>
</html>
