<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        img{
            width: 100%;
            display: block;
        }

        section{
            width: 100%;
            height: 100vh;
            /* background: url(https://www.donga.co.kr/upload/post/71b984f7-f606-4dd3-a5c7-bb685606ac4d.jpg) no-repeat center / 100%; */
            padding: 0 250px;
            display: flex;
            align-items: center;
            color: white;
            
            position: relative;
            overflow: hidden;
        }

        section img{
            animation: bg_ani 2.5s forwards;
            position: absolute;
            top: 0;
            left: 0;
        }

        @keyframes bg_ani {
            0%{
                /* background-size: 100%; */
                transform: scale(1);
            }

            100%{
                /* background-size: 120%; */
                transform: scale(1.1);
            }
        }

        section h1{
            font-size: 70px;
            transform: translateY(100%);
            opacity: 0;
            animation: title_ani 1s 0.5s forwards;
        }

        @keyframes title_ani {
            0%{
                transform: translateY(100%);
            }
            
            100%{
                transform: translateY(0%);
                opacity: 1;
            }
        }

        section p{
            font-size: 24px;
            margin-top: 50px;
            transform: translateX(-40%);
            opacity: 0;
            animation: sub_title_ani 1s 2s forwards;
        }

        @keyframes sub_title_ani {
            0%{
                transform: translateX(-40%);
            }

            100%{
                transform: translateX(0%);
                opacity: 1;
            }
        }

    </style>

</head>
<body>
    
    <section>
        <img src="https://www.donga.co.kr/upload/post/71b984f7-f606-4dd3-a5c7-bb685606ac4d.jpg" alt="">

        <div class="title_wrap">

            <h1>
                구성원의 행복한 몰입을 바탕으로 <br>
                이해관계자의 번영을 도모합니다
            </h1>
    
            <p>
                인류의 건강과 행복을 위한 끝없는 도전
            </p>

        </div>

    </section>

</body>
</html>
