<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
         .box{
            width: 300px;
            height: 300px;
            background-color: teal;

            /* *애니메이션 축약
            animation: name duration timing-function delay iteration-count direction fill-mode; */

            animation: ani 2s infinite alternate;
            position: absolute;
            top: 0;
            left: 0;
        }

        .box_1{
            animation-delay: 1s;
            animation-duration: 3s;
            background-color: pink;
        }

        @keyframes ani {
            0%{
                top:0;
                left:0;
                transform: rotate(0deg) skew(0deg);
            }

            50%{
                top:300px;
                left:300px;
                transform: rotate(360deg) skew(0);
                background-color: gold;
                border-radius: 50%;
            }

            100%{
                top:0px;
                left:600px;
                transform: rotate(360deg) skew(45deg);
                background-color: salmon;
                
            }
        }
    </style>
</head>
<body>

    <!-- *문제
    =>엘리먼트가 지그재그로 움직임
    =>360도 회전, 배경색 변경, 둥글기, 기울기 적용 
    =>무한 반복함  -->

    <div class="box"></div>
    <div class="box box_1"></div>

    
</body>
</html>
