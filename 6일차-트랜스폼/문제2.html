<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        a{
            text-decoration: none;
            color: #000;
        }

        img{
            width: 100%;
            display: block;
        }

        .con_wrap{
            width: 1600px;
            margin: 100px auto;
            display: flex;
            justify-content: space-between;
        }

        .con{
            width: 32%;
        }

        .img_wrap{
            height: 440px;
            border-radius: 20px;
            overflow: hidden;
        }

        .img_wrap img{
            transition: 0.5s;
        }

        .con h3{
            font-size: 28px;
            margin: 20px 0
        }

        .tag_wrap{
            display: flex;
        }

        .tag{
            font-size: 14px;
            border: 1px solid #808080;
            border-radius: 30px;
            padding: 2px 10px;
            margin-right: 10px;
        }

        .con:hover img{
            transform: scale(1.1);
        }

    </style>
    
</head>
<body>
    
    <div class="con_wrap">

        <div class="con">
            <a href="#">

                <div class="img_wrap">
                    <img src="https://goyos.kr/img/category_design.png" alt="">

                <h3>DESIGN</h3>

                    <div class="tag">Figma</div>
                    <div class="tag">UX UI</div>

        </div>

        <div class="con">

                </div>

                <h3>DESIGN</h3>
