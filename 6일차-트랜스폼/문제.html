<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .box{
            width: 200px;
            height: 200px;
            background-color: salmon;
            margin: 100px auto;
            transition: 3s;
        }

        .box:hover{
            /* transform: rotate(360deg);
            transform: scale(0.5); */

            transform: rotate(360deg) scale(0.5) skew(45deg);
            /* =>트랜스폼의 값을 여러개 쓸땐 띄어쓰기로 구분하여 작성 */
        }

    </style>
</head>
<body>
    
    <!-- *문제
    =>300*300크기 엘리먼트 제작, 가운데 정렬
    =>엘리먼트에 마우스를 올리면 360도 3초간 회전이 되면서,
    절반 크기로 줄어들게 만들기  -->

    <div class="box"></div>

</body>
</html>
