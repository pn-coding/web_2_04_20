<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        img{
            width: 100%;
            display: block;
        }

        section{
            padding: 150px;
        }

        .container{
            max-width: 1600px;
            width: 100%;
            display: flex;
            justify-content: space-between;
        }

        .title_wrap{
            width: 38%;
        }

        .title_wrap h3{
            font-size: 60px;
        }

        .title_wrap p{
            color: #808080;
            margin-top: 15px;
        }

        .con_wrap{
            width: 60%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 20px;
        }

        .con{
            width: 48%;
        }

        @media screen and (max-width:1280px) {
            section{
                padding: 150px 80px;
            }
        }

        @media screen and (max-width:1024px) {
            .title_wrap h3{
                font-size: 48px;
            }

            .con{
                width: 47%;
                font-size: 15px;
            }
        }

        @media screen and (max-width:768px) {
            section{
                padding: 150px 20px;
            }

            .container{
                flex-direction: column;
            }

            .title_wrap{
                width: 100%;
            }

            .con_wrap{
                width: 100%;
                margin-top: 50px;
                gap: 15px;
            }

            .con{
                width: 46%;
                font-size: 14px;
            }
        }

    </style>
</head>
