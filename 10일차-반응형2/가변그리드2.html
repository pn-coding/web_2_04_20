<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        img{
            width: 100%;
            display: block;
        }

        /* *px -> 퍼센트 변경
        =>변경할 값 / 상위 부모 * 100 */

        .con_wrap{
            /* width: 1400px; */
            width: 72.91666%;
            /* background-color: lightblue; */
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
        }

        .con{
            /* width: 452.33333px; */
            width: 32.30952%;        
        }

        .img_wrap{
            height: 400px;
        }

        .img_wrap:nth-child(1){
            background: url(https://plus.unsplash.com/premium_photo-1667030474693-6d0632f97029?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8Y2F0fGVufDB8fDB8fHww) no-repeat center / cover;
        }

        .img_wrap:nth-child(2){
            background: url(https://plus.unsplash.com/premium_photo-1667030474693-6d0632f97029?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8Y2F0fGVufDB8fDB8fHww) no-repeat center / cover;
        }

        .img_wrap:nth-child(3){
            background: url(https://plus.unsplash.com/premium_photo-1667030474693-6d0632f97029?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8Y2F0fGVufDB8fDB8fHww) no-repeat center / cover;
        }

        .con h3{
            font-size: 20px;
            margin-top: 15px;
        }

        @media screen and (max-width: 1024px) {
            .img_wrap{
                height: 250px;
            }
        }

        @media screen and (max-width: 768px) {
            .con_wrap{
                flex-direction: column;
            }

            .con{
                width: 100%;
                margin-bottom: 50px;
            }

        }

    </style>
</head>
<body>
    
    <div class="con_wrap">

        <div class="con">
            <div class="img_wrap"></div>

            <h3>Contents title</h3>
        </div>

        <div class="con">
            <div class="img_wrap"></div>

            <h3>Contents title</h3>
        </div>

        <div class="con">
            <div class="img_wrap"></div>

            <h3>Contents title</h3>
        </div>

    </div>

</body>
</html>
